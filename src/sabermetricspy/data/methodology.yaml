# Reference-status audit of metrics and models against their published methods.
# Applied to MetricSpec.reference_status at registration; rendered to docs/METHODOLOGY.md.
# status: matches | approximate | divergent | unverified. evidence: golden | primary | secondary (audited entries only). Audit date: 2026-10-18.
metrics:
  avg:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: Matches FanGraphs published values for Bonds 2001, McGwire 1998 and Judge 2022 (tests/golden/batting.yaml).
  avg_ev:
    status: approximate
    evidence: golden
    source_url: https://baseballsavant.mlb.com/csv-docs
    note: 'ev_sum / ev_count over tracked batted balls (balls in play; foul balls with a tracked speed are excluded, ADR-0028). On the recorded sample the mean is 86.92 mph against FanGraphs'' EV of 87.45: FanGraphs appears to drop the slowest rollers (omitting the four slowest reproduces it to 0.002 mph) but publishes no rule. Checked on one recorded sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/pitch_arsenal.yaml).'
  avg_extension:
    status: matches
    evidence: primary
    source_url: https://baseballsavant.mlb.com/csv-docs
    note: Mean of Savant's release_extension (feet, as tracked by Statcast). Savant's extension leaderboard was not retrievable, so no published player value was compared.
  avg_spin:
    status: matches
    evidence: golden
    source_url: https://baseballsavant.mlb.com/leaderboard/pitch-arsenals
    note: Mean release spin rate reproduces Savant's pitch-arsenal average spin for all six pitch types to the whole rpm (FF 2,226.2 vs 2,226). Checked on one recorded sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/pitch_arsenal.yaml).
  avg_velo:
    status: matches
    evidence: golden
    source_url: https://baseballsavant.mlb.com/leaderboard/pitch-arsenals
    note: Mean release speed reproduces Savant's pitch-arsenal average speed for all six pitch types (FF 96.85 vs 96.9, SI 96.61 vs 96.6, SL, CH, CU, FS) to Savant's one decimal. Checked on one recorded sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/pitch_arsenal.yaml).
  b1:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: 1B = H - 2B - 3B - HR reproduces the FanGraphs leaderboard 1B for 4 hitters (tests/golden/batting_counting.yaml).
  ba_minus_xba:
    status: approximate
    evidence: golden
    source_url: https://baseballsavant.mlb.com/leaderboard/expected_statistics
    note: AVG minus xBA, so it inherits xBA's shortfall against the player-season leaderboard (about 0.0014 for the recorded sample; tests/golden/pitch_arsenal.yaml).
  babip:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/offense/babip/
    note: Matches FanGraphs published values for Bonds 2001, McGwire 1998 and Judge 2022 (tests/golden/batting.yaml). Formula (H-HR)/(AB-K-HR+SF) matches the FanGraphs Library.
  barrel_pct:
    status: matches
    evidence: golden
    source_url: https://baseballsavant.mlb.com/csv-docs
    note: Barrels are Statcast's own launch_speed_angle == 6 label, so the count equals the FanGraphs Barrels value (32) and the rate equals FanGraphs' 6.65% on the recorded sample (tests/golden/pitch_arsenal.yaml). Without a launch_speed_angle column the preset derives no barrels; the numeric zone table is not published.
  base_runs:
    status: matches
    evidence: primary
    source_url: https://tangotiger.net/wiki_archive/Base_Runs.html
    note: Reproduces Smyth's version 1 (multiplier 1.02) when only basic columns are supplied and version 2 (adds HBP, IBB, SB, CS, GDP; multiplier 1.1) when any of those columns is present. Verified against the published formulas, not numerically.
  bat_bb_pct_plus:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: 'Reproduces the FanGraphs batter BB%+ for 8 hitters in 2016 and 2024 (tests/golden/batting_indices.yaml): BB% divided by the BB% of the player''s own league (AL or NL, non-pitchers). The library formerly used the MLB-wide rate and was corrected (ADR-0028).'
  bat_k_pct_plus:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: 'Reproduces the FanGraphs batter K%+ for 8 hitters in 2016 and 2024 (tests/golden/batting_indices.yaml): K% divided by the K% of the player''s own league (AL or NL, non-pitchers). The library formerly used the MLB-wide rate and was corrected (ADR-0028).'
  bauer_units:
    status: matches
    evidence: secondary
    source_url: https://swarthmorephoenix.com/2018/02/01/understanding-spin-rate-and-baseballs-tech-upgrade/
    note: Spin rate in rpm divided by velocity in mph; secondary sources (student press, coaching pieces) attribute it to Driveline Baseball and agree on the formula, but no Driveline primary source was found. Built on avg_spin and avg_velo, which are checked against Savant.
  bb_pct:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: Matches FanGraphs published values for Bonds 2001, McGwire 1998 and Judge 2022 (tests/golden/batting.yaml). Walks include intentional walks.
  bb_pct_plus:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: 'Reproduces the FanGraphs pitcher BB%+ for 16 pitchers (tests/golden/pitching_indices.yaml): BB% divided by the BB/TBF of the pitcher''s own league. The library formerly used one MLB-wide rate and was corrected (ADR-0028).'
  bb_per_9:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: Matches FanGraphs published values for 12 pitcher seasons (tests/golden/pitching.yaml).
  bb_to_k:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: BB / SO reproduces the FanGraphs leaderboard BB/K for 4 hitters in 2024 (tests/golden/batting_counting.yaml).
  bf_per_ip:
    status: matches
    evidence: secondary
    source_url: https://sabr.org/journal/article/new-measures-for-pitchers/
    note: 'BFP/IP, total batters faced over innings pitched, as SABR''s New Measures for Pitchers defines it (three batters retired per inning, so 4.00 means three quarters of batters retired; the article puts the major league average between 4.2 and 4.3). Computed as 3 * TBF / outs. Pinned by a hand-computed test (tests/test_metric_values.py); no printed player value was reproduced, so the evidence tier is secondary.'
  i_to_str:
    status: matches
    evidence: golden
    source_url: https://www.baseball-reference.com/leagues/majors/2024-pitches-pitching.shtml
    note: 'Baseball-Reference I/Str: balls put into play (home runs included) over total strikes seen, where strikes are Statcast pitch type S or X. Replaces bip_pct (balls in play over swings, which no source publishes; ADR-0050). Reproduces the printed 24.2 percent on the Tarik Skubal 2024 sample (481 of 1,985 strikes; tests/golden/strike_breakdown_rates.yaml).'
  bsr:
    status: approximate
    evidence: primary
    source_url: https://library.fangraphs.com/offense/bsr/
    note: BsR = wSB + wGDP + UBR. wSB now matches FanGraphs (league constant bundled); UBR is caller supplied, and the wGDP constants (league GIDP rate 0.105 and run value 0.44) have no published source (the FanGraphs wGDP page gives neither), so BsR stays approximate when GIDP columns are supplied.
  catcher_cs_pct:
    status: matches
    evidence: golden
    source_url: https://www.baseball-reference.com/players/c/contrwi01.shtml
    note: CS / (SB + CS) against reproduces Baseball-Reference's caught-stealing percentage for Willson Contreras 2024 (22.9). tests/golden/fielding_team_expectancy.yaml
  cent_pct:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/pitching/batted-ball/
    note: Reproduces the FanGraphs pitcher leaderboard rate from the published counts for 20 pitcher seasons (2003, 2009, 2016, 2019, 2024; tests/golden/batted_ball.yaml) within 1e-8. Divides by Pull+Cent+Oppo; corrected from bbe (ADR-0028).
  cg_pct:
    status: matches
    evidence: secondary
    source_url: https://en.wikipedia.org/wiki/Complete_game
    note: CG / GS, the complete-game share of starts, as implied by Wikipedia's complete-game table; confirmed only by a secondary source; no primary source states the formula.
  clutch:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/misc/clutch/
    note: (WPA/pLI - WPA/LI) per FanGraphs' clutch definition reproduces the published Clutch score for the five batters within 1e-5. tests/golden/fielding_team_expectancy.yaml
  contact_pct:
    status: approximate
    evidence: golden
    source_url: https://library.fangraphs.com/offense/plate-discipline/
    note: Formula matches the FanGraphs Library. On one recorded Baseball Savant pitch sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/plate_discipline.yaml) the library lands within 0.25 percentage points of the FanGraphs Statcast-based rate; FanGraphs applies its own pitch classification and tracked-pitch subset, so the rates are not identical. Foul tips count as contact; fouls count as contact, as FanGraphs does.
  cstr_pct:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/offense/plate-discipline/
    note: Called strikes (including automatic strikes) over all pitches reproduces the FanGraphs CStr% for Tarik Skubal 2024 exactly (501/2,868; tests/golden/plate_discipline.yaml).
  csw_pct:
    status: approximate
    evidence: golden
    source_url: https://library.fangraphs.com/offense/plate-discipline/
    note: Formula matches the FanGraphs Library. On one recorded Baseball Savant pitch sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/plate_discipline.yaml) the library lands within 0.25 percentage points of the FanGraphs Statcast-based rate; FanGraphs applies its own pitch classification and tracked-pitch subset, so the rates are not identical. CSW% = CStr% + SwStr% (FanGraphs C+SwStr%).
  der:
    status: approximate
    evidence: secondary
    source_url: https://www.baseballprospectus.com/news/article/2387/getting-pade-improving-on-defensive-efficiency/
    note: Computed as 1 - BABIP. The Baseball Prospectus page cited gives DER as (outs - K) / (BIP - HR), which counts errors as plays not made; 1 - BABIP counts them as outs converted, so the two differ by the error rate. Only a secondary description was retrieved.
  dice:
    status: matches
    evidence: secondary
    source_url: https://en.wikipedia.org/wiki/Defense-Independent_Component_ERA
    note: 'Matches the published definition 3.00 + (13*HR + 3*(BB+HBP) - 2*K)/IP (secondary sources: Wikipedia, R package documentation).'
  dips_bop_pct:
    status: matches
    evidence: primary
    source_url: https://sabr.org/journal/article/the-many-flavors-of-dips-a-history-and-an-overview/
    note: (HR + BB + HBP + SO) / TBF, McCracken's original 'balls kept out of play' formula as printed in the SABR survey of DIPS. No published player values were retrieved.
  effective_velo:
    status: matches
    evidence: primary
    source_url: https://baseballsavant.mlb.com/csv-docs
    note: Mean of Savant's effective_speed field (derived from release extension). The library averages the supplied field and does not recompute it; no published player value was compared.
  era:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: Matches FanGraphs published values for 12 pitcher seasons (tests/golden/pitching.yaml).
  era_minus:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/pitching/era-fip-xfip/
    note: 100 x ERA x (2 - PF/100) / league ERA of the pitcher's own league (AL or NL, bundled for 1990 to 2025 from AL/NL ER and outs), the formula printed on the FanGraphs Library page. Reproduces the page's NL 2014 table (3.00 ERA with park factors 95, 98, 102 gives 86, 84, 80) and the Kershaw 2014 example (50), and seven FanGraphs leaderboard pitchers within 0.33 points (tests/golden/pitching.yaml, tests/test_game_score_and_off.py). Before this the library divided by the park factor and used the MLB-wide ERA, 0.6 to 1.0 points off.
  era_plus:
    status: approximate
    evidence: golden
    source_url: https://www.baseball-reference.com/players/m/martipe02.shtml
    note: 'Formula 100 * lgERA * PF / ERA matches Wikipedia''s ERA+. Against Baseball-Reference ERA+ (tests/golden/era_plus.yaml) the library runs 2-6% low (Pedro Martinez 2000: 276.6 vs 291; Randy Johnson 2001: 184.7 vs 188; Tarik Skubal 2024: 172.3 vs 174) and the cause is not established: switching to the pitcher''s own league ERA (tested 2026-10-19) helps Martinez (285.4) but widens the gap for Johnson (182.4) and Skubal (169.8), so the residual is most likely Baseball-Reference''s own park factor and league definition, which the 403 glossary pages do not let us read. The library uses the MLB-wide ERA and a caller-supplied park factor.'
  err_pct:
    status: matches
    evidence: secondary
    source_url: https://library.fangraphs.com/defense/
    note: Errors over total chances, the complement of fielding percentage; verified through fpct (a secondary check, since no site publishes it separately).
  fb_pct:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/pitching/batted-ball/
    note: Reproduces the FanGraphs pitcher leaderboard rate from the published counts for 20 pitcher seasons (2003, 2009, 2016, 2019, 2024; tests/golden/batted_ball.yaml) within 1e-8. Denominator GB+FB+LD; fly balls include infield flies and home runs.
  fip:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/pitching/fip/
    note: Matches FanGraphs published values for 12 pitcher seasons (tests/golden/pitching.yaml). Walks include intentional walks, as FanGraphs does.
  fip_minus:
    status: approximate
    evidence: golden
    source_url: https://library.fangraphs.com/pitching/era-fip-xfip/
    note: 'Same page, which says the calculation is identical to ERA-: 100*FIP*(2-PF/100)/own-league FIP (AL or NL), as implemented since ADR-0045. The 7 fixtures still differ from FanGraphs by 0.2 to 3.1 points (tests/golden/pitching.yaml: Johnson 2001 46.37 vs 47.27, Schilling 67.72 vs 69.48, Pedro Martinez 2000 44.48 vs 47.61, Skubal 2024 60.32 vs 59.58), and the old MLB-wide form was no closer, so the cause is unresolved. The Guts! FIP park factor column is empty for 2001, and the factors implied by the published values (ARI about 1.015 to 1.021, NYY 0.994) do not follow from the HR, SO and BB park factors either, so FanGraphs'' FIP- park input cannot be reconstructed from public data.'
  f_to_str:
    status: matches
    evidence: golden
    source_url: https://www.baseball-reference.com/leagues/majors/2024-pitches-pitching.shtml
    note: 'Baseball-Reference F/Str: pitches fouled off over total strikes seen. Replaces foul_pct (fouls over swings, which no leaderboard publishes; ADR-0050). Foul bunts count as fouls and foul tips as swinging strikes: 529 of 1,985 strikes reproduces the printed 26.6 percent for Tarik Skubal 2024, while 525 (foul only) would print 26.4 (tests/golden/strike_breakdown_rates.yaml).'
  fp_strike_pct:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/offense/plate-discipline/
    note: First-pitch strikes over plate appearances reproduces the FanGraphs F-Strike% for Tarik Skubal 2024 exactly (517/753; tests/golden/plate_discipline.yaml). The statcast preset does not derive the first-pitch columns; supply first_pitch_strikes and pa.
  fp_swing_pct:
    status: matches
    evidence: golden
    source_url: https://www.baseball-reference.com/players/split.fcgi?id=skubata01&year=2024&t=p
    note: 'First-pitch swings over plate appearances, with bunt attempts counted as swings. FanGraphs and Savant publish no F-Swing%; Baseball-Reference''s ''Swung or Took First Pitch of PA'' split prints Swung 277 and Took 476 for Tarik Skubal 2024, and the Statcast sample gives 277 first-pitch swings. Jeff Sullivan''s ''Return of the First-Pitch Swing'' (FanGraphs) uses the same split as the first-pitch swing rate. The name F-Swing% is the library''s own, by analogy with F-Strike%. Without bunts the sample count is 272 (tests/golden/strike_breakdown_rates.yaml).'
  fpct:
    status: matches
    evidence: golden
    source_url: https://www.baseball-reference.com/players/w/wittbo02.shtml
    note: (PO + A) / (PO + A + E) reproduces the published .974 for Witt 2024. tests/golden/fielding_team_expectancy.yaml
  gb_pct:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/pitching/batted-ball/
    note: 'Reproduces the FanGraphs pitcher leaderboard rate from the published counts for 20 pitcher seasons (2003, 2009, 2016, 2019, 2024; tests/golden/batted_ball.yaml) within 1e-8. Denominator GB+FB+LD (the FanGraphs Library: ground balls per ball in play); home runs are inside FB.'
  gb_to_fb:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/pitching/batted-ball/
    note: Reproduces the FanGraphs pitcher leaderboard rate from the published counts for 20 pitcher seasons (2003, 2009, 2016, 2019, 2024; tests/golden/batted_ball.yaml) within 1e-8.
  gpa:
    status: matches
    evidence: primary
    source_url: https://tangotiger.net/wiki_archive/Gross_Production_Average.html
    note: (1.8*OBP + SLG) / 4, as published on the Tango wiki and Wikipedia (Aaron Gleeman, 2003). No worked example is published.
  h_per_9:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: 27 * H / outs reproduces the FanGraphs H/9 for 16 pitcher seasons (2001, 2016, 2024; tests/golden/pitching_indices.yaml) within 1e-5.
  haa:
    status: approximate
    evidence: golden
    source_url: https://blogs.fangraphs.com/a-visual-primer-on-horizontal-approach-angle-haa/
    note: 'HAA = -arctan(vx_f / vy_f) from the nine-parameter flight, as in Chamberlain''s FanGraphs primer (2023-11-22); the statcast preset now derives haa_sum and haa_count with the same flight time and arctan series as VAA. Positive means toward the catcher''s right. Chamberlain''s 2023 four-seamer table prints 1.3 degrees for Cole, Gausman, Javier, Cease and Morton; the library gives 1.29, 1.31, 1.28, 1.33 and 1.22 (tolerance 0.1 degree, his pitch filtering is not stated). Neither Savant nor FanGraphs publishes player HAA to reproduce beyond that table (tests/golden/strike_breakdown_rates.yaml).'
  hard_hit_pct:
    status: matches
    evidence: golden
    source_url: https://baseballsavant.mlb.com/csv-docs
    note: Exit velocity of at least 95 mph (Savant's hard-hit definition) over batted-ball events reproduces FanGraphs' HardHit and HardHit% exactly for Skubal 2024 (162 of 481 = 0.33680) now that foul balls are excluded (ADR-0028). Savant's pitch-arsenal hard_hit_percent uses an undocumented denominator and is not reproduced. Checked on one recorded sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/pitch_arsenal.yaml).
  hb:
    status: matches
    evidence: golden
    source_url: https://baseballsavant.mlb.com/leaderboard/pitch-movement
    note: Mean pfx_x times 12 inches reproduces Savant's pitcher_break_x for Skubal's four-seamer (6.49 vs 6.5). pfx_x is from the catcher's perspective, so the sign depends on the pitcher's handedness; only a left-handed pitcher was checked. Checked on one recorded sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/pitch_arsenal.yaml).
  hr_pct:
    status: matches
    evidence: golden
    source_url: https://www.baseball-reference.com/players/j/judgeaa01-bat.shtml
    note: 'Home runs over plate appearances, Baseball-Reference''s HR%. Aaron Judge 2024: 58 of 704 prints 8.2 (tests/golden/strike_breakdown_rates.yaml).'
  hr_per_9:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: Matches FanGraphs published values for 12 pitcher seasons (tests/golden/pitching.yaml).
  hr_to_fb:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/pitching/batted-ball/
    note: Reproduces the FanGraphs pitcher leaderboard rate from the published counts for 20 pitcher seasons (2003, 2009, 2016, 2019, 2024; tests/golden/batted_ball.yaml) within 1e-8. FB includes infield fly balls.
  ip:
    status: matches
    evidence: primary
    source_url: https://www.baseball-reference.com/players/m/martipe02.shtml
    note: Outs divided by 3. Published innings use the .1/.2 notation for thirds (Baseball-Reference 217.0, FanGraphs 182.1); the golden ERA and H/9 fixtures convert it to outs and reproduce the published rates.
  iso:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: Matches FanGraphs published values for Bonds 2001, McGwire 1998 and Judge 2022 (tests/golden/batting.yaml).
  ivb:
    status: matches
    evidence: golden
    source_url: https://baseballsavant.mlb.com/leaderboard/pitch-movement
    note: Mean pfx_z times 12 inches reproduces Savant's induced vertical break for Skubal's four-seamer (16.26 vs 16.2; Savant rounds to one decimal). Checked on one recorded sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/pitch_arsenal.yaml).
  k_minus_bb_pct:
    status: matches
    evidence: primary
    source_url: https://library.fangraphs.com/pitching/rate-stats
    note: K% minus BB%, with K% and BB% as the FanGraphs Library defines them (per plate appearance); FanGraphs publishes the same difference as K-BB% for pitchers.
  k_pct:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: Matches FanGraphs published values for Bonds 2001, McGwire 1998 and Judge 2022 (tests/golden/batting.yaml).
  k_pct_plus:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: 'Reproduces the FanGraphs pitcher K%+ for 16 pitchers (tests/golden/pitching_indices.yaml): K% divided by the SO/TBF of the pitcher''s own league (AL or NL, all pitchers). The library formerly used one MLB-wide rate and was corrected (ADR-0028).'
  k_per_9:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: Matches FanGraphs published values for 12 pitcher seasons (tests/golden/pitching.yaml).
  k_to_bb:
    status: matches
    evidence: primary
    source_url: https://www.fangraphs.com/leaders/major-league
    note: Reciprocal of BB/K (checked against the FanGraphs BB/K leaderboard in tests/golden/batting_counting.yaml); pitcher K/BB is checked separately.
  kwera:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/api/leaders/major-league/data?stats=pit
    note: 'FanGraphs kwERA = C - 12*(SO-BB)/TBF with a seasonal C (measured; the cited Hardball Times page does not print the formula). For 1990-2020, C = lgERA + 12*(lgSO-lgBB)/lgTBF, exact for 2001 and 2016-2020; for 2021-2025 C = lgERA + 1.887, a term that equals no league K-BB rate, so it is empirical. 13 FanGraphs leaderboard pitcher seasons reproduced within 1e-4 (tests/test_kwera.py). Tango''s original 5.40 constant is the fallback when no constant is bundled.'
  ld_pct:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/pitching/batted-ball/
    note: Reproduces the FanGraphs pitcher leaderboard rate from the published counts for 20 pitcher seasons (2003, 2009, 2016, 2019, 2024; tests/golden/batted_ball.yaml) within 1e-8. Denominator GB+FB+LD.
  lob_pct:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: Matches FanGraphs published values for 12 pitcher seasons (tests/golden/pitching.yaml). Formula (H+BB+HBP-R)/(H+BB+HBP-1.4*HR).
  meatball_swing_pct:
    status: approximate
    evidence: golden
    source_url: https://baseballsavant.mlb.com/leaderboard/custom?year=2024&type=pitcher&min=1&selections=pitch_count,meatball_percent,meatball_swing_percent
    note: 'Swings (bunt attempts included) over pitches in Statcast zone 5. Savant''s Meatball% and Meatball Swing% reproduce on two pitchers (Tarik Skubal 2024: 8.9 and 79.8; Edward Cabrera 2024: 6.3 and 72.7) when meatball is zone 5, the centre cell of its 3x3 grid, over located pitches. Savant publishes no definition, so the zone-5 reading is inferred from those two pitchers, hence approximate. Meatball is not the heart attack zone, which is far larger (FanGraphs, Looking into the heart zone). From 2026 Savant measures plate_x and plate_z at mid-plate and takes the zone from ABS, so check newer data (tests/golden/strike_breakdown_rates.yaml).'
  o_contact_pct:
    status: approximate
    evidence: golden
    source_url: https://library.fangraphs.com/offense/plate-discipline/
    note: Formula matches the FanGraphs Library. On one recorded Baseball Savant pitch sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/plate_discipline.yaml) the library lands within 0.25 percentage points of the FanGraphs Statcast-based rate; FanGraphs applies its own pitch classification and tracked-pitch subset, so the rates are not identical. Largest observed gap on the sample (0.25 points).
  o_swing_pct:
    status: approximate
    evidence: golden
    source_url: https://library.fangraphs.com/offense/plate-discipline/
    note: Formula matches the FanGraphs Library. On one recorded Baseball Savant pitch sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/plate_discipline.yaml) the library lands within 0.25 percentage points of the FanGraphs Statcast-based rate; FanGraphs applies its own pitch classification and tracked-pitch subset, so the rates are not identical. Pitches without a tracked location are no longer counted as out of the zone (corrected, ADR-0028).
  obp:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: Matches FanGraphs published values for Bonds 2001, McGwire 1998 and Judge 2022 (tests/golden/batting.yaml).
  oppo_pct:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/pitching/batted-ball/
    note: Reproduces the FanGraphs pitcher leaderboard rate from the published counts for 20 pitcher seasons (2003, 2009, 2016, 2019, 2024; tests/golden/batted_ball.yaml) within 1e-8. Divides by Pull+Cent+Oppo; corrected from bbe (ADR-0028).
  ops:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: Matches FanGraphs published values for Bonds 2001, McGwire 1998 and Judge 2022 (tests/golden/batting.yaml).
  ops_plus:
    status: approximate
    evidence: primary
    source_url: https://www.baseball-reference.com/about/bat_glossary.shtml
    note: Baseball-Reference park-adjusts the league OBP and SLG after removing pitchers; the library applies a single 1/PF to the ratio using MLB-wide league averages.
  pit_bb_pct:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: Matches FanGraphs published values for 12 pitcher seasons (tests/golden/pitching.yaml).
  pit_bb_to_k:
    status: matches
    evidence: primary
    source_url: https://www.fangraphs.com/leaders/major-league
    note: BB / SO, the reciprocal of the FanGraphs K/BB reproduced in tests/golden/pitching_indices.yaml.
  pit_k_minus_bb_pct:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: K% minus BB% per batter faced reproduces the FanGraphs K-BB% for 16 pitcher seasons (tests/golden/pitching_indices.yaml).
  pit_k_pct:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: Matches FanGraphs published values for 12 pitcher seasons (tests/golden/pitching.yaml).
  pit_k_to_bb:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: SO / BB reproduces the FanGraphs K/BB for 16 pitcher seasons (tests/golden/pitching_indices.yaml).
  pli:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/misc/li
    note: 'Average leverage index, the sum of LI over plate appearances divided by PA (Tango''s definition: the average is 1); reproduces FanGraphs'' pLI for the five checked batters. tests/golden/fielding_team_expectancy.yaml'
  pu_pct:
    status: approximate
    evidence: primary
    source_url: https://baseballsavant.mlb.com/csv-docs
    note: 'Popups per batted-ball event, where popups are a bb_type separate from fly balls (Baseball Savant''s bb_type lists ground_ball, line_drive, fly_ball and popup). FanGraphs'' IFFB% is a different statistic: infield flies divided by fly balls, with infield flies a subset of FB (confirmed on 20 fixture rows). With FanGraphs-style columns (iffb mapped to pu) the schema''s derived bbe adds pu to GB+FB+LD and double counts, so supply bbe explicitly or use pu/fb.'
  pull_pct:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/pitching/batted-ball/
    note: Reproduces the FanGraphs pitcher leaderboard rate from the published counts for 20 pitcher seasons (2003, 2009, 2016, 2019, 2024; tests/golden/batted_ball.yaml) within 1e-8. FanGraphs divides by Pull+Cent+Oppo (equal to GB+FB+LD+BU in every fixture row), not by GB+FB+LD; the library previously divided by bbe and was corrected to the direction total (ADR-0028).
  putaway_pct:
    status: matches
    evidence: golden
    source_url: https://baseballsavant.mlb.com/leaderboard/pitch-arsenal-stats
    note: Strikeouts over two-strike pitches reproduces Savant's pitch-arsenal put_away for the four-seamer, sinker and changeup exactly (24.51, 23.63, 30.83 vs 24.5, 23.6, 30.8). The statcast preset does not derive the two-strike columns. Checked on one recorded sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/pitch_arsenal.yaml).
  pythag_luck:
    status: matches
    evidence: golden
    source_url: https://www.baseball-reference.com/teams/NYY/2024.shtml
    note: Actual wins minus pythagorean wins; the pythagorean side is checked against Baseball-Reference for three teams. tests/golden/fielding_team_expectancy.yaml
  pythag_win_pct:
    status: matches
    evidence: golden
    source_url: https://en.wikipedia.org/wiki/Pythagorean_expectation
    note: RS^x / (RS^x + RA^x) with the default Pythagenpat exponent (ADR-0027) gives Baseball-Reference's pythagorean wins for NYY 96, BAL 90 and COL 59 once rounded. With exponent 2 at least one team misses. tests/golden/fielding_team_expectancy.yaml
  pythag_wins:
    status: matches
    evidence: golden
    source_url: https://en.wikipedia.org/wiki/Pythagorean_expectation
    note: Pythagorean win percentage times games reproduces Baseball-Reference's expected wins for NYY 96, BAL 90 and COL 59. tests/golden/fielding_team_expectancy.yaml
  pythagenpat_win_pct:
    status: approximate
    evidence: primary
    source_url: https://www.baseball-reference.com/about/war_explained_runs_to_wins.shtml
    note: Default exponent is (runs per game)^0.287; Baseball-Reference uses 0.285 and sources conflict on which is canonical. Set SeasonContext.pythagenpat_exponent to choose.
  qera:
    status: matches
    evidence: primary
    source_url: https://sabr.org/journal/article/the-many-flavors-of-dips-a-history-and-an-overview/
    note: (2.69 - 0.66*GB/BIP + 3.88*BB/PA - 3.4*K/PA)^2, the QERA (QuikERA) formula as printed in the SABR Baseball Research Journal survey of DIPS. No published player values were retrieved, so there is no numeric check.
  qs_pct:
    status: matches
    evidence: secondary
    source_url: https://en.wikipedia.org/wiki/Quality_start
    note: QS / GS, the share of starts that were quality starts (at least six innings, three earned runs or fewer); confirmed only by secondary sources, and FanGraphs publishes the QS count but not a QS% rate.
  r_per_pa:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/guts.aspx?type=cn
    note: 'Runs over plate appearances. League R / TBF rounds to the FanGraphs Guts! R/PA in all 36 seasons from 1990 to 2025 (league totals and Guts! snapshots under tests/golden/).'
  ra9:
    status: matches
    evidence: secondary
    source_url: https://en.wikipedia.org/wiki/Run_average
    note: 9 * runs allowed / IP (27 * R / outs), counting earned and unearned runs; confirmed only by secondary sources (Wikipedia run average), and the FanGraphs and Baseball-Reference definitions were not retrievable.
  rbi_per_pa:
    status: approximate
    evidence: secondary
    source_url: https://www.baseball-reference.com/players/j/judgeaa01-bat.shtml
    note: 'RBI per plate appearance, a plain ratio whose name states its denominator; pinned by a hand-computed test. Baseball-Reference prints only AB/RBI, so no outside value reproduces it.'
  rc27:
    status: approximate
    evidence: secondary
    source_url: https://en.wikipedia.org/wiki/Runs_created
    note: Scales Runs Created to 27 outs, as Wikipedia describes RC/27. The out estimate AB - H + SH + SF + CS + GIDP is the common convention but no retrieved primary source states it, so the denominator is a documented assumption.
  rc_basic:
    status: matches
    evidence: primary
    source_url: https://tangotiger.net/wiki_archive/Runs_Created.html
    note: James's basic Runs Created (H + BB) * TB / (AB + BB), as on the Tango wiki and Wikipedia. Baseball-Reference's glossary lists a basic variant with HBP and SF added to the walk and opportunity terms; this is the original form.
  rc_tech:
    status: matches
    evidence: primary
    source_url: https://www.baseball-reference.com/about/bat_glossary.shtml
    note: Matches the technical Runs Created formula in the Baseball-Reference glossary.
  rew:
    status: approximate
    evidence: secondary
    source_url: https://library.fangraphs.com/misc/wpa/
    note: REW is wins from WPA/LI-style leverage; FanGraphs' published REW implies a player-specific runs-per-win that the library does not model, so values can differ from the site.
  rf_per_9:
    status: matches
    evidence: golden
    source_url: https://www.baseball-reference.com/players/w/wittbo02.shtml
    note: 9 x (PO + A) / innings, with innings from outs (4181 outs), reproduces Baseball-Reference's RF/9 (3.67). tests/golden/fielding_team_expectancy.yaml
  rf_per_g:
    status: matches
    evidence: golden
    source_url: https://www.baseball-reference.com/players/w/wittbo02.shtml
    note: (PO + A) / games reproduces Baseball-Reference's RF/G for Witt (3.55). tests/golden/fielding_team_expectancy.yaml
  run_diff:
    status: matches
    evidence: golden
    source_url: https://www.baseball-reference.com/teams/NYY/2024.shtml
    note: RS - RA reproduces the published run differential for the 2024 Yankees, Orioles and Rockies. tests/golden/fielding_team_expectancy.yaml
  rv_per_100:
    status: matches
    evidence: golden
    source_url: https://baseballsavant.mlb.com/leaderboard/pitch-arsenal-stats
    note: 100 times the pitcher's run value over pitches reproduces Savant's run_value_per_100 for the four-seamer, sinker and changeup (2.06, 1.54, 0.96 vs 2.1, 1.5, 1.0) when the run value is the negative of Savant's delta_run_exp (the batting side's change). The statcast preset does not derive pitch_rv_sum, so the caller supplies it with that sign. Checked on one recorded sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/pitch_arsenal.yaml).
  sb_pct:
    status: matches
    evidence: golden
    source_url: https://www.baseball-reference.com/players/w/wittbo02.shtml
    note: SB / (SB + CS) reproduces Baseball-Reference's SB% for Bobby Witt Jr. 2024 (72.1). tests/golden/fielding_team_expectancy.yaml
  seca:
    status: matches
    evidence: primary
    source_url: https://tangotiger.net/wiki_archive/Secondary_Average.html
    note: (TB - H + BB + SB - CS) / AB, as published on the Tango wiki and Wikipedia (created by Bill James). The published page has no worked example, so no numeric check exists.
  siera:
    status: approximate
    evidence: primary
    source_url: https://www.baseballprospectus.com/news/article/10045/introducing-siera-part-5/
    note: 'Implements the original 2010 Baseball Prospectus coefficients (SIERACoefficients.version = baseball_prospectus_2010), including the sign rule on the squared net ground-ball term. FanGraphs displays the revised 2011 version (https://blogs.fangraphs.com/new-siera-part-four-of-five-testing: constant 5.534, adds a (BB/PA)^2 term of 27.252, a 0.367 share-of-innings-as-starter term and per-year coefficients). Tested 2026-10-19 on 16 FanGraphs 2024 pitchers (8 relievers, 8 starters): the 2011 coefficients leave a near-constant offset of about 0.47 to 0.49 (standard deviation 0.006 to 0.01 depending on the net ground-ball definition), which is the unpublished 2024 year coefficient, so the version is confirmed but the formula is not exactly reproduced; the 2010 version here runs about 0.46 to 0.69 lower. Not yet implemented as a selectable version because the per-year coefficients after 2010 are not published.'
  slg:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: Matches FanGraphs published values for Bonds 2001, McGwire 1998 and Judge 2022 (tests/golden/batting.yaml).
  speed_score:
    status: matches
    evidence: primary
    source_url: https://blogs.fangraphs.com/speed-score/
    note: Implements the four-factor form (stolen-base percentage, attempt rate, triples, runs scored; each limited to 0-10) confirmed by Wikipedia, FanGraphs and a calculator page. James's original six-factor form also averages GIDP and defensive position and range; those constants rest on a single secondary source and are not implemented.
  sv_pct:
    status: matches
    evidence: secondary
    source_url: https://en.wikipedia.org/wiki/Save_(baseball)
    note: 'SV / (SV + BS): saves over save opportunities, the save percentage Wikipedia defines; confirmed only by a secondary source and assumes save opportunities equal saves plus blown saves.'
  sweet_spot_pct:
    status: matches
    evidence: primary
    source_url: https://baseballsavant.mlb.com/csv-docs
    note: Launch angle from 8 to 32 degrees (Savant's sweet-spot definition) over batted-ball events; foul balls are excluded (ADR-0028). No published player value was compared.
  swing_pct:
    status: approximate
    evidence: golden
    source_url: https://library.fangraphs.com/offense/plate-discipline/
    note: Formula matches the FanGraphs Library. On one recorded Baseball Savant pitch sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/plate_discipline.yaml) the library lands within 0.25 percentage points of the FanGraphs Statcast-based rate; FanGraphs applies its own pitch classification and tracked-pitch subset, so the rates are not identical. Bunt attempts are not swings (corrected from counting them, ADR-0028).
  swstr_pct:
    status: approximate
    evidence: golden
    source_url: https://library.fangraphs.com/offense/plate-discipline/
    note: Formula matches the FanGraphs Library. On one recorded Baseball Savant pitch sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/plate_discipline.yaml) the library lands within 0.25 percentage points of the FanGraphs Statcast-based rate; FanGraphs applies its own pitch classification and tracked-pitch subset, so the rates are not identical. Swinging strikes include blocked swinging strikes and exclude foul tips.
  ta:
    status: matches
    evidence: primary
    source_url: https://tangotiger.net/wiki_archive/Total_Average.html
    note: (TB + BB + HBP + SB) / (AB - H + CS + GIDP), as on the Tango wiki and Wikipedia (Boswell). The library formerly subtracted CS in the numerator and was corrected (ADR-0028). No worked example is published.
  tb:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: TB = 1B + 2*2B + 3*3B + 4*HR reproduces the published slugging times AB for 4 hitters and Baseball-Reference's TB 392 for Judge 2024 (tests/golden/batting_counting.yaml).
  tc:
    status: matches
    evidence: golden
    source_url: https://www.baseball-reference.com/players/w/wittbo02.shtml
    note: PO + A + E reproduces Baseball-Reference's total chances for Witt at shortstop 2024 (583). tests/golden/fielding_team_expectancy.yaml
  total_break:
    status: approximate
    evidence: secondary
    source_url: https://baseballsavant.mlb.com/leaderboard/pitch-movement
    note: Mean over pitches of sqrt(IVB^2 + HB^2), summed per pitch by the statcast preset (total_break_sum) so opposite-direction breaks do not cancel (ADR-0040). The geometry is standard, but no published total-break definition was found, so it is checked by hand-computed tests only.
  two_strike_chase_pct:
    status: approximate
    evidence: secondary
    source_url: https://library.fangraphs.com/offense/plate-discipline/
    note: O-Swing% restricted to two-strike pitches. A library-defined rate; no published 2K-Chase% definition was found, and the statcast preset does not derive the two-strike columns.
  ubb:
    status: matches
    evidence: primary
    source_url: https://library.fangraphs.com/offense/woba/
    note: BB - IBB, the unintentional walk term in the FanGraphs wOBA definition; falls back to BB when IBB is absent.
  vaa:
    status: approximate
    evidence: secondary
    source_url: https://en.wikipedia.org/wiki/PITCHf/x
    note: Arctangent of vertical over longitudinal velocity at the front of home plate from the constant-acceleration (9-parameter) trajectory, evaluated by a fifth-order series. The model is standard (Nathan; Wikipedia PITCHf/x) but no published VAA player value was retrieved and the primary derivation was not accessible, so the implementation is unchecked numerically.
  wgdp:
    status: approximate
    evidence: secondary
    source_url: https://library.fangraphs.com/offense/wgdp/
    note: Runs from avoiding double plays relative to league opportunity. The formula follows the FanGraphs description, but its league constant was not sourced (out of scope of this change), so no published value was reproduced.
  whiff_pct:
    status: approximate
    evidence: golden
    source_url: https://library.fangraphs.com/offense/plate-discipline/
    note: Swinging strikes over swings, counting foul tips as contact as FanGraphs does. Savant's whiff percent counts foul tips as misses and bunts as swings, so it is higher (four-seamer 27.7 against 23.3 here; counting foul tips as misses gives 27.66). The sources differ, so the metric is labeled approximate; define a custom translator to use Savant's convention. Checked on one recorded sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/pitch_arsenal.yaml).
  whiff_per_100:
    status: approximate
    evidence: golden
    source_url: https://library.fangraphs.com/offense/plate-discipline/
    note: 100 times swinging strikes per pitch (FanGraphs SwStr% x 100). Within 0.1 points of FanGraphs on the recorded sample (tests/golden/plate_discipline.yaml). Savant counts foul tips as misses and so would report more.
  whip:
    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: Matches FanGraphs published values for 12 pitcher seasons (tests/golden/pitching.yaml).
  win_pct:
    status: matches
    evidence: golden
    source_url: https://www.baseball-reference.com/teams/NYY/2024.shtml
    note: W / (W + L) reproduces the published .580, .562 and .377 for those teams. tests/golden/fielding_team_expectancy.yaml
  woba:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/offense/woba/
    note: Matches the FanGraphs formula (uBB, HBP, 1B-HR weighted over AB+BB-IBB+SF+HBP) and published wOBA within weight rounding (tests/golden/batting.yaml).
  woba_minus_xwoba:
    status: matches
    evidence: golden
    source_url: https://baseballsavant.mlb.com/leaderboard/expected_statistics
    note: 'wOBA minus xwOBA: 0.2462 - 0.2586 = -0.0124 against Savant''s published -0.013 (computed from the rounded 0.246 and 0.259), within the rounding of the inputs. Checked on one recorded sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/pitch_arsenal.yaml).'
  wpa_li:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/misc/wpa/
    note: WPA/LI as the sum of per-PA WPA divided by LI; supplied as a sum and reproduces FanGraphs' value for five batters. tests/golden/fielding_team_expectancy.yaml
  wraa:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/offense/wrc/
    note: Matches published wRAA within weight rounding (tests/golden/batting.yaml).
  wrc:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/offense/wrc/
    note: Matches published wRC within weight rounding (tests/golden/batting.yaml).
  wrc_plus:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/offense/wrc/
    note: 'Formula follows the FanGraphs Library with the AL/NL non-pitcher wRC/PA denominator. Reproduces published wRC+ within about 0.1% (Bonds 2001: 234.41 vs 234.59), the residual coming from FanGraphs'' own league aggregation and park-factor rounding. Park factor defaults to 100 (no adjustment): pass the published factor.'
  wsb:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/offense/wsb/
    note: SB x runSB + CS x runCS - lgwSB x (1B + BB + HBP - IBB). The bundled lg_wsb is now computed for 1990 to 2025 from league SB, CS and on-base events (tests/golden/league_sbcs_snapshot.yaml) and reproduces FanGraphs' published 2024 values for eight players to three decimals (tests/test_league_wsb.py). Before this, lg_wsb defaulted to 0 and omitted the league adjustment.
  xba:
    status: approximate
    evidence: golden
    source_url: https://baseballsavant.mlb.com/leaderboard/pitch-arsenal-stats
    note: Sum of Savant's estimated_ba_using_speedangle over at-bats reproduces the pitch-arsenal est_ba per pitch type (FF 0.196, SI 0.210, CH 0.201) but runs 0.0014 under the player-season leaderboard (0.2036 vs 0.205), which also uses sprint speed that the pitch-level field omits. Checked on one recorded sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/pitch_arsenal.yaml).
  xbh:
    status: matches
    evidence: primary
    source_url: https://en.wikipedia.org/wiki/Extra-base_hit
    note: 'Doubles plus triples plus home runs, the definition of an extra-base hit (Wikipedia: any base hit on which the batter advances past first base).'
  xbh_pct:
    status: approximate
    evidence: secondary
    source_url: https://en.wikipedia.org/wiki/Extra-base_hit
    note: Extra-base hits per plate appearance. The published share-of-hits form (SABR, 1997; Wikipedia's McGwire comparison) divides by hits, and no standard per-PA rate was found, so this is a library-defined rate.
  xbt_pct:
    status: approximate
    evidence: secondary
    source_url: https://blogs.fangraphs.com/ultimate-base-running-primer/
    note: Extra bases taken over opportunities; the definition is standard but FanGraphs and Baseball-Reference publish rates, not the opportunity counts, so the recomputation gate cannot be run and no published value was reproduced.
  xfip:
    status: matches
    evidence: primary
    source_url: https://library.fangraphs.com/pitching/xfip/
    note: Formula matches the FanGraphs Library. Null before 2002 because FanGraphs publishes league HR/FB only from 2002. No player-level published xFIP was checked (fly balls not retrieved).
  xfip_minus:
    status: approximate
    evidence: primary
    source_url: https://library.fangraphs.com/principles/park-factors/
    note: Uses the printed ERA-form park term (ADR-0045) but the MLB-wide league xFIP, because FanGraphs divides by the AL or NL xFIP and that cannot be derived from the bundled data. Inherits the FIP- residual (see fip_minus); no published xFIP- value was retrieved, so it is not checked numerically.
  xslg:
    status: approximate
    evidence: golden
    source_url: https://baseballsavant.mlb.com/leaderboard/pitch-arsenal-stats
    note: Reproduces the pitch-arsenal est_slg per pitch type (FF 0.321, SI 0.313, CH 0.304) but runs 0.0024 under the player-season leaderboard (0.3296 vs 0.332) because the pitch-level field omits sprint speed. Checked on one recorded sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/pitch_arsenal.yaml).
  xwoba:
    status: matches
    evidence: golden
    source_url: https://baseballsavant.mlb.com/leaderboard/expected_statistics
    note: Reproduces the player-season est_woba (0.2586 vs 0.259) and the pitch-arsenal est_woba per pitch type (FF 0.262, SI 0.252, CH 0.230) within Savant's three-decimal rounding. Checked on one recorded sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/pitch_arsenal.yaml).
  z_contact_pct:
    status: approximate
    evidence: golden
    source_url: https://library.fangraphs.com/offense/plate-discipline/
    note: 'Formula matches the FanGraphs Library. On one recorded Baseball Savant pitch sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/plate_discipline.yaml) the library lands within 0.25 percentage points of the FanGraphs Statcast-based rate; FanGraphs applies its own pitch classification and tracked-pitch subset, so the rates are not identical. '
  z_swing_pct:
    status: approximate
    evidence: golden
    source_url: https://library.fangraphs.com/offense/plate-discipline/
    note: Formula matches the FanGraphs Library. On one recorded Baseball Savant pitch sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/plate_discipline.yaml) the library lands within 0.25 percentage points of the FanGraphs Statcast-based rate; FanGraphs applies its own pitch classification and tracked-pitch subset, so the rates are not identical. Pitches without a tracked location are neither in nor out of the zone (corrected, ADR-0028).
  zone_pct:
    status: approximate
    evidence: golden
    source_url: https://library.fangraphs.com/offense/plate-discipline/
    note: Formula matches the FanGraphs Library. On one recorded Baseball Savant pitch sample (Tarik Skubal 2024, 2,868 pitches; tests/golden/plate_discipline.yaml) the library lands within 0.25 percentage points of the FanGraphs Statcast-based rate; FanGraphs applies its own pitch classification and tracked-pitch subset, so the rates are not identical. Divides by located pitches when out-of-zone pitches are supplied (corrected, ADR-0028); FanGraphs' plain Zone% uses Baseball Info Solutions zones and cannot be reproduced from Savant data.
  game_score:
    status: matches
    evidence: golden
    source_url: https://en.wikipedia.org/wiki/Game_score
    note: 'Reproduces published games from the Wikipedia page: Kerry Wood 1998 = 105 and Max Scherzer''s 2015 no-hitter = 104. The formula is read from that secondary page; James''s original text was not retrieved. tests/test_game_score_and_off.py'
  game_score_v2:
    status: matches
    evidence: primary
    source_url: https://blogs.fangraphs.com/instagraphs/game-score-v2-0
    note: Implements the formula printed in Tango's FanGraphs article. The article prints no player value, so the 7 IP line (64) in tests/test_game_score_and_off.py is a hand-computed check, not a published one. The article's yearly base shift is not modeled.
  'off':
    status: matches
    evidence: primary
    source_url: https://library.fangraphs.com/offense/off/
    note: Implements the formula printed on the FanGraphs Library page (wRAA + park term + league term + BsR) and is recomputed from it in tests/test_game_score_and_off.py. The page prints no player value, so no published number was reproduced.
  shutdown:
    status: matches
    evidence: primary
    source_url: https://library.fangraphs.com/pitching/sd-md/
    note: Implements the page's definition (reliever, game WPA of +0.06 or more, inclusive). The page prints no player values and the FanGraphs leaderboard SD counts need per-game WPA that is not bundled, so only the threshold semantics are tested (tests/test_shutdown_meltdown.py).
  meltdown:
    status: matches
    evidence: primary
    source_url: https://library.fangraphs.com/pitching/sd-md/
    note: Implements the page's definition (reliever, game WPA of -0.06 or lower, inclusive). Same validation limits as shutdown.
  base_advance_average:
    status: matches
    evidence: golden
    source_url: https://www.retrosheet.org/Research/HardegreeG/Base-Advance-Average.pdf
    note: Reproduces every row of the paper's worked half-inning (bases advanced and opportunities per plate appearance; totals 14 and 57 as printed) from base states and runs, plus the 4-for-10 bases-loaded walk and 10-for-10 grand slam it describes; tests/golden/base_advance_sample_inning.yaml. The paper prints .245 for 14/57 = .2456 (truncated). Steals are not counted.
models:
  WARFramework.calculate_pitcher_war_df:
    status: approximate
    evidence: golden
    source_url: https://library.fangraphs.com/war/calculating-war-pitchers/
    note: Implements the documented FanGraphs method (ifFIP, FIP-to-RA9, FIP park factor, AL/NL league FIP, dynamic runs per win, 0.12/0.03 replacement wins per game, reliever leverage multiplier) and reproduces every figure of FanGraphs' published Stroman 2016 worked example. Against 29 live leaderboard pitchers (2016 and 2024) 27 are within 0.25 WAR (median under 0.1, up to about 0.2 WAR for starters and relievers; the exceptions are one mixed starter/reliever line and one unexplained 0.42 WAR starter), for reasons FanGraphs does not publish; the league correction is published for 2016 only, so other seasons are uncorrected (typically about -0.15 WAR per 200 IP); mixed starter/reliever rows use the page's blended replacement and are less accurate than valuing each role separately.
  WARFramework.calculate_position_player_*:
    status: approximate
    evidence: golden
    source_url: https://library.fangraphs.com/war/war-position-players/
    note: 'With league_pa (and mlb_games) the replacement term is the FanGraphs formula 570*(G/2430)*(RPW/lgPA)*PA, and with defensive_innings the positional adjustment is prorated by innings/9/162 (1,458-inning table). Against 2024 leaderboard rows (tests/golden/position_war_2024.yaml) replacement matches within 0.01 runs for 8 players, WAR = (Offense + Defense + wLeague + Replacement)/RPW holds within 0.005, and the framework reproduces Ohtani at 8.9259 vs 8.9261. Labeled approximate because the defaults (no league_pa, no innings) are still a flat 20 runs per 600 PA and PA/600 proration, and fielding (UZR), UBR, wGDP and the league adjustment are caller-supplied inputs, not computed here.'
  MarcelProjector (hitters):
    status: approximate
    evidence: golden
    source_url: http://www.tangotiger.net/archives/stud0346.shtml
    note: Reproduces Tango's Beltran worked example (weighted 318 HR over 7,938 PA plus 1,200 PA of league average gives .0386 HR/PA and 22 HR; tests/test_model_audit.py), and playing time 0.5*PA1 + 0.1*PA2 + 200. The age adjustment (+0.006 per year under 29, -0.003 over 29) follows Tango's corrected description but has no worked example. The final re-baselining step is not implemented.
  MarcelProjector (pitchers):
    status: approximate
    evidence: primary
    source_url: http://www.tangotiger.net/archives/stud0346.shtml
    note: 'Supported by configuration: season_weights=(3, 2, 1), exposure_col=''ip'' and playing_time_base=25 (relievers) or 60 (starters), or a column of per-player bases, as in Tango''s March 2004 pitcher post; the playing-time formula 0.5*IP1 + 0.1*IP2 + base is tested (tests/test_model_audit.py). The post gives no innings equivalent for the regression step, so regression_pa must be chosen by the caller, the by-GS/G interpolation for part-timers is left to the caller, and the ERA split with BaseRuns and league assignment are not implemented. The default configuration is the hitter one. The earlier 134 IP constant had no source and was removed from the documentation.'
  Log5Model:
    status: matches
    evidence: primary
    source_url: https://en.wikipedia.org/wiki/Log5
    note: Team form (pA - pA pB) / (pA + pB - 2 pA pB) and batter-pitcher odds-ratio form with a league rate both equal the published formulas, including the article's 0.6 vs 0.4 arithmetic (0.36 / 0.52). The sources cite Bill James as the originator; the original text was not retrieved. tests/test_model_audit.py
  MarkovChainModel.fit_transitions:
    status: approximate
    evidence: golden
    source_url: https://beanumber.github.io/abdwr3e/09-simulation.html
    note: 'Estimates the 24 x 25 base-out transition matrix from play-by-play and solves the absorbing chain exactly (N = (I-Q)^-1), the construction in Albert, Baumer and Marchi, Analyzing Baseball Data with R (3rd ed.), chapter 9.2. On Retrosheet 2016 batting plays in complete half-innings (183,817 plays; tests/test_markov_transitions.py, which needs the data file) it reproduces every printed transition probability to the printed digits (0.0334, 0.676, 0.235, 0.0503, 0.00563 from the empty state; the eight probabilities from runner on second with two outs, 0.650 to end the inning), the 4.27 plate appearances per half-inning, the expected plays to the end of the inning from eight states (4.27, 2.87, 1.46, 4.33, 2.99, 1.53, 4.34, 2.93), and the three-batter state distribution (0.372, 0.241, 0.0815, 0.0739, 0.0529, 0.0286). Its exact run expectancy is within 0.06 of the book matrix, which is a 10,000-inning simulation per state (tests/golden/markov_abdwr_2016.yaml). A home-run-or-out chain reproduces the closed form 3p/(1-p). Batting plays only: steals, wild pitches and passed balls are excluded, as in the book (the book measures their effect at up to 0.08 runs per state). The reference check runs only when the data file is supplied; CI supplies it (step added 2026-10-20, not yet run), so the tier stays approximate until that run has passed.'
  MarkovChainModel:
    status: approximate
    evidence: primary
    source_url: https://en.wikipedia.org/wiki/Markov_chain
    note: 'fit() takes event probabilities and applies fixed advancement rules chosen for this library (a single scores runners from second and third and moves a runner on first to second; a double moves a runner on first to third; no double plays, steals or errors). The absorbing-chain solution is exact and matches the negative-binomial closed form for a home-run-or-out batter (3p/(1-p)). Fed the 2016 league-average event rates (singles 14.9%, doubles 4.5%, triples 0.5%, home runs 3.0%, walks and hit batters 9.1%, everything else an out) it gives 0.479 runs from the empty state against 0.485 from the fitted matrix, 0.846 against 0.848 with a runner on first and 2.131 against 2.212 with the bases loaded and no outs, and 4.41 plate appearances per half-inning against 4.27. The longer innings follow from rules with no double plays or outs on the bases; the effect of each rule was not separated. Event-probability Markov models appear in Bukiet, Harold and Palacios (1997), which was behind a paywall and was not read; its rules are not used. The figures above are pinned by tests/test_markov_transitions.py (needs the Retrosheet data file). Use fit_transitions when play-by-play is available. tests/test_model_audit.py'
  MonteCarloSimulator:
    status: approximate
    evidence: primary
    source_url: https://en.wikipedia.org/wiki/Monte_Carlo_method
    note: Uses the same event and advancement rules as MarkovChainModel; its mean runs per game converges to the exact chain value within four standard errors for a fixed seed. Carries the same simplified-advancement caveat; see MarkovChainModel for the measured gap to the fitted chain. tests/test_model_audit.py
  RunExpectancyMatrix:
    status: matches
    evidence: golden
    source_url: https://library.fangraphs.com/misc/re24/
    note: The built-in default table is the published FanGraphs RE24 matrix (roughly neutral for 2014, 4.15 runs per game), pinned cell by cell by tests/golden/run_expectancy_table.yaml; the previous 'canonical 2024' table was unsourced and differed by up to 0.086 runs (ADR-0028). The empirical fit() computes mean runs to the end of the inning per base-out state; it was not compared with a season fitted from play-by-play, which is not bundled.
  CountExpectancyMatrix:
    status: approximate
    evidence: golden
    source_url: https://beanumber.github.io/abdwr3e/06-pitchcount.html
    note: 'There is no built-in table (ADR-0049); fit() estimates mean runs to the end of the inning per outs, bases and count state, counting each plate appearance once per count. Opt-in check on Retrosheet 2016 (190,713 event rows, tests/test_retrosheet_2016_count_fit.py, data from abdwr3edata): the number of event rows through 1-0, 0-1, 2-2 and 1-1 equals the n printed in Albert, Baumer and Marchi chapter 6 exactly (76,165; 94,106; 44,254; 75,226), and the mean of RE288(state, count) - RE288(state, 0-0) is within 0.006 runs of their printed mean run value (differences 0.003 to 0.005; fit() uses realised runs, which are noisier than the chapter''s RE24 change). Approximate rather than matches because the default suite does not run that check (it needs the 2.8 MB data file and pyreadr) and Tango''s published RE288 is printed only as images with no stated seasons (tests/golden/count_run_values.yaml pins the Walsh count values).'
  LinearWeightsEstimator:
    status: approximate
    evidence: secondary
    source_url: https://www.fangraphs.com/guts.aspx?type=cn
    note: Follows the FanGraphs Guts! construction (run value above out times a scale that sets wOBA equal to OBP) and the scale identity is tested. A numeric reproduction of the published weights needs season play-by-play run values, which are not bundled, so no published weight was reproduced. tests/test_model_audit.py
  WinExpectancyMatrix:
    status: approximate
    evidence: golden
    source_url: http://tangotiger.net/welist.html
    note: 'The observed home win rate per inning, half, outs, bases and score difference; there is no built-in table and unobserved states stay unfitted. Tom Tango''s published table (tests/golden/win_expectancy_tango.yaml, a 2002 page that states no seasons or method) is a reference to compare with, not the construction used; his current page (tangotiger.net/we.html, 2010 to 2015) describes a model built from run expectancy. A state''s rate is the share of its plate appearances in games the home team won; the reported standard error uses the number of games, an approximation because the plate appearances of one game share a result. Hand-computed rates are pinned by tests/test_win_expectancy_matrix.py. On Retrosheet 2016 (2,428 games, one tied game dropped, 184,541 plate appearances; tests/test_retrosheet_2016_win_expectancy.py, which needs the data file) 16 bottom-of-the-9th cells have 30 or more games and all lie within three standard errors of the published table (largest 2.11); the 6 cells with 100 or more games lie within 1.7. One season leaves rarer states with few games, so read results.state_games before using a cell. CI supplies the data file (step added 2026-10-20, not yet run).'
  WinProbabilityModel:
    status: approximate
    evidence: golden
    source_url: http://tangotiger.net/welist.html
    note: 'A closed-form normal approximation (runs per game, home edge, RE24 scaled to the run environment), compared with 54 cells of Tom Tango''s published win-expectancy table (bottom of the 9th tied and trailing by one, top of the 9th and bottom of the 7th tied; tests/golden/win_expectancy_tango.yaml). Mean absolute error 0.048; tied bottom 9th mean 0.028, max 0.108; trailing by one run is worse (mean 0.078, max 0.194, runner on second and third with no outs: 0.527 against 0.721), because the approximation ignores that one run ties the game. The table states no seasons or run environment. Use WinExpectancyMatrix, built from play-by-play, when exact values matter.'
  EmpiricalBayesShrinker:
    status: matches
    evidence: primary
    source_url: https://en.wikipedia.org/wiki/Empirical_Bayes_method
    note: Posterior mean (k + a) / (n + a + b), equivalent to shrinkage weight M / (n + M) toward the population mean, is the standard beta-binomial result. The prior is fitted by beta-binomial maximum likelihood (no clamps; tests/test_empirical_bayes_fit.py recovers simulated strengths of 10, 100 and 1000) or fixed by stabilization_trials. Efron and Morris (1975) was not retrievable (publisher returned 403). tests/test_model_audit.py
  Log5Model.extended_pythagorean_home_win_prob:
    status: matches
    evidence: primary
    source_url: https://web.williams.edu/Mathematics/sjmiller/public_html/math/papers/PythagBothTeams20.pdf
    note: 'Implements equations 1.4 and 1.5 of Cleary, Jeffries, Miller, Miller, Murray and Skiera: opponent-rescaled runs raised to the exponent; the league-free form is equal (tests/test_model_audit.py) and it reduces to the Pythagorean formula against an average opponent. The paper''s reported playoff total (80.18 expected series wins against 80 actual) needs 2001 to 2019 series data and was not reproduced. The exponent is a required argument because the paper cites Baseball-Reference''s 1.87 and notes 1.83 is also common.'
