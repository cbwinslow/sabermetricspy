    status: matches
    evidence: golden
    source_url: https://www.fangraphs.com/leaders/major-league
    note: TB = 1B + 2*2B + 3*3B + 4*HR reproduces the published slugging times AB for 4 hitters and Baseball-Reference's TB 392 for Judge 2024 (tests/golden/batting_counting.yaml).
