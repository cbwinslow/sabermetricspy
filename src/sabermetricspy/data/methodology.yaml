models:
  WARFramework.calculate_pitcher_war_df:
    status: divergent
    source_url: https://library.fangraphs.com/war/calculating-war-pitchers/
    note: Not the FanGraphs or Baseball-Reference method. FanGraphs uses ifFIP, a FIP-to-RA9 adjustment, dynamic runs per win, replacement of 0.12 (starters) / 0.03 (relievers) wins per game, a leverage multiplier and a league correction; the library uses a flat .380 replacement win percentage and league FIP as league RA9. Rewrite is a follow-on change.
  WARFramework.calculate_position_player_*:
    status: approximate
    source_url: https://library.fangraphs.com/war/war-position-players/
    note: Structure follows FanGraphs (batting + baserunning + fielding + positional + league + replacement over runs per win). Replacement is a flat 20 runs per 600 PA instead of 570*(G/2430)*(RPW/lgPA)*PA, and the positional adjustment is scaled by PA/600 instead of defensive innings.
  MarcelProjector (hitters):
    status: approximate
    source_url: http://www.tangotiger.net/archives/stud0346.shtml
    note: Weights 5/4/3, regression to 1,200 PA of league average, playing time 0.5*PA1 + 0.1*PA2 + 200 and the age adjustment (+0.006 per year under 29, -0.003 over 29) match Tango's method. The final re-baselining step is not implemented.
  MarcelProjector (pitchers):
    status: divergent
    source_url: http://www.tangotiger.net/archives/stud0346.shtml
    note: Tango uses weights 3/2/1 and an IP base of 25 (relievers) or 60 (starters); the class documents 5/4/3 weights and a 134 IP regression constant that no source supports.
  Log5Model:
    status: unverified
