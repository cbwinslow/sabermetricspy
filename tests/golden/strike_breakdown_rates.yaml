# Published values for the strike-breakdown, first-pitch, meatball, HAA and per-PA rates (ADR-0050).
# Pitch input: tests/fixtures/statcast/ (Baseball Savant statcast_search CSV exports, retrieved 2026-10-20).
# Every published value is printed to one decimal (a percent) or one decimal of degrees, so tests compare after rounding.
baseball_reference_skubal_2024:
  # https://www.baseball-reference.com/leagues/majors/2024-pitches-pitching.shtml (pitch summary, I/Str and F/Str columns)
  sample: tests/fixtures/statcast/skubal_2024_pitches.csv
  strikes: 1985
  i_to_str_pct: 24.2
  f_to_str_pct: 26.6
  # https://www.baseball-reference.com/players/split.fcgi?id=skubata01&year=2024&t=p
  # "Swung or Took First Pitch of PA": Swung at 1st Pitch 277 PA, Took 1st Pitch 476 PA.
  first_pitch_swung: 277
  first_pitch_took: 476
savant_meatball:
  # Baseball Savant custom leaderboard, 2024, selections meatball_percent and meatball_swing_percent.
  # https://baseballsavant.mlb.com/leaderboard/custom?year=2024&type=pitcher&min=1&selections=pitch_count,meatball_percent,meatball_swing_percent
  # Meatball% is zone-5 pitches over located pitches; Meatball Swing% is zone-5 swings (bunt attempts included) over zone-5 pitches.
  # The zone-5 reading is inferred from these two pitchers; Savant publishes no definition.
  skubal_2024:
    sample: tests/fixtures/statcast/skubal_2024_pitches.csv
    located_pitches: 2838
    meatball_pct: 8.9
    meatball_swing_pct: 79.8
  cabrera_2024:
    sample: tests/fixtures/statcast/cabrera_2024_pitches.csv
    located_pitches: 1734
    meatball_pct: 6.3
    meatball_swing_pct: 72.7
chamberlain_haa_2023:
  # Chamberlain, "A Visual Primer on Horizontal Approach Angle (HAA)", FanGraphs, 2023-11-22,
  # https://blogs.fangraphs.com/a-visual-primer-on-horizontal-approach-angle-haa/
  # Table "2023 Four-Seamer HAA(AA)": 1.3 degrees for each of these five pitchers.
  sample: tests/fixtures/statcast/four_seamers_2023_haa.csv
  published_degrees: 1.3
  # Computed values range from 1.218 (Morton) to 1.331 (Cease); the article prints one decimal and its pitch
  # filtering is not stated, so the tolerance is 0.1 degree.
  tolerance: 0.1
  pitchers:
    543037: Gerrit Cole
    592332: Kevin Gausman
    664299: Cristian Javier
    656302: Dylan Cease
    450203: Charlie Morton
baseball_reference_hr_pct:
  # https://www.baseball-reference.com/players/j/judgeaa01-bat.shtml, Aaron Judge 2024: HR% printed 8.2.
  hr: 58
  pa: 704
  hr_pct: 8.2
