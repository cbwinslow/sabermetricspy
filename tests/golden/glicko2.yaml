# Golden fixture: Glicko-2 rating update, Glickman's worked example. Same entry style as sabermetricspy tests/golden/*.yaml
# (entries: id, source_url, retrieved, inputs, published, tolerance), plus `locator` and `basis` keys.
#
# Source (primary, author's own page): Mark E. Glickman, "Example of the Glicko-2 system", Boston University, 2022-03-22.
#   https://www.glicko.net/glicko/glicko2.pdf   local copy: sources/glickman_2022_glicko2_example/glicko2.pdf
#   (sha256 c8eace98bb5c..., 6 pages; the worked example is on PDF pages 4-6; step 5 text says the iteration was "revised as of February 22, 2012, and is now stable").
# Glicko-1 comparison: Glickman, "The Glicko system", http://www.glicko.net/glicko/glicko.pdf (sources/glickman_1999_glicko1/glicko.pdf), p.3-4.
# Retrieved: 2026-10-22 (logs/retrieval_seed.jsonl).
# Licence / attribution: no licence is stated in either PDF. Only the numbers (facts) and short formula quotes are reused here; cite Glickman
#   in the docstring and methodology entry; do not copy the PDF text into the repository.
#
# Tolerances (derived from the PDF's own rounding, see dossiers/glicko2_update.md section 4; none were loosened to make a row pass):
#   g, E, mu_j, phi_j are printed to 3-4 decimals -> 5e-5 (E: 5e-4, printed to 3 decimals).
#   v and Delta are computed in the PDF from the ROUNDED g and E (replay in repro.py: 1.778507 and -0.48339), so full precision differs by ~5e-4 -> 1e-3.
#   sigma' is printed TRUNCATED at 5 decimals (0.05999; true 0.059996) -> 1e-5.   phi' -> 5e-5.   mu' -> 1e-4.
#   r' and RD' are converted by the PDF from ROUNDED mu' and phi' (1 unit of mu' = 173.7 rating points, so +-0.0087) plus 2-decimal printing -> 0.015.
#   fA, fB: printed to 8 and 6 decimals, computed with the PDF's rounded v, Delta, phi -> 5e-7.
# Rule 7: the example is the method author's own worked numbers (not an independent outside implementation); it validates arithmetic only.
entries:
- id: glicko2_pdf_example_inputs_to_scale
  basis: printed
  source_url: https://www.glicko.net/glicko/glicko2.pdf
  locator: glicko2.pdf p.5 (table of mu_j, phi_j, g, E)
  retrieved: '2026-10-22'
  inputs: {r: 1500, rd: 200, sigma: 0.06, tau: 0.5, opponents: [[1400, 30, 1.0], [1550, 100, 0.0], [1700, 300, 0.0]]}
  published:
    mu: 0.0
    phi: 1.1513
    mu_j: [-0.5756, 0.2878, 1.1513]
    phi_j: [0.1727, 0.5756, 1.7269]
    g: [0.9955, 0.9531, 0.7242]
    E: [0.639, 0.432, 0.303]
  tolerance: {mu: 5.0e-5, phi: 5.0e-5, mu_j: 5.0e-5, phi_j: 5.0e-5, g: 5.0e-5, E: 5.0e-4}
- id: glicko2_pdf_example_v_delta
  basis: printed
  source_url: https://www.glicko.net/glicko/glicko2.pdf
  locator: glicko2.pdf p.5 ("v = ... = 1.7785", "Delta = ... = -0.4834")
  retrieved: '2026-10-22'
  inputs: {r: 1500, rd: 200, sigma: 0.06, tau: 0.5, opponents: [[1400, 30, 1.0], [1550, 100, 0.0], [1700, 300, 0.0]]}
  published: {v: 1.7785, delta: -0.4834}
  tolerance: {v: 1.0e-3, delta: 1.0e-3}
- id: glicko2_pdf_example_volatility_bracket
  basis: printed
  source_url: https://www.glicko.net/glicko/glicko2.pdf
  locator: glicko2.pdf p.5 (A, B, fA, fB at the start of step 5)
  retrieved: '2026-10-22'
  inputs: {r: 1500, rd: 200, sigma: 0.06, tau: 0.5, opponents: [[1400, 30, 1.0], [1550, 100, 0.0], [1700, 300, 0.0]]}
  published: {A0: -5.62682, B0: -6.12682, fA0: -0.00053567, fB0: 1.999675, illinois_iterations: 2, A_final: -5.62696}
  tolerance: {A0: 5.0e-6, B0: 5.0e-6, fA0: 5.0e-7, fB0: 5.0e-7, illinois_iterations: 0, A_final: 5.0e-6}
- id: glicko2_pdf_example_new_rating
  basis: printed
  source_url: https://www.glicko.net/glicko/glicko2.pdf
  locator: glicko2.pdf p.5-6 (sigma', phi*, phi', mu', r', RD')
  retrieved: '2026-10-22'
  inputs: {r: 1500, rd: 200, sigma: 0.06, tau: 0.5, eps: 1.0e-6, opponents: [[1400, 30, 1.0], [1550, 100, 0.0], [1700, 300, 0.0]]}
  published: {sigma_new: 0.05999, phi_star: 1.152862, phi_new: 0.8722, mu_new: -0.2069, r_new: 1464.06, rd_new: 151.52}
  tolerance: {sigma_new: 1.0e-5, phi_star: 2.0e-5, phi_new: 5.0e-5, mu_new: 1.0e-4, r_new: 0.015, rd_new: 0.015}
# Optional group: only if the owner also wants Glicko-1 (dossier open question). Same inputs, different system.
- id: glicko1_pdf_example
  basis: printed
  source_url: http://www.glicko.net/glicko/glicko.pdf
  locator: glicko.pdf p.4 (d^2 = 53670.85 = 231.67^2; r' = 1500 + 131.9(-0.272) = 1464; RD' = sqrt(22918.9) = 151.4)
  retrieved: '2026-10-22'
  inputs: {r: 1500, rd: 200, opponents: [[1400, 30, 1.0], [1550, 100, 0.0], [1700, 300, 0.0]]}
  published: {d2: 53670.85, r_new: 1464, rd_new: 151.4}
  tolerance: {d2: 30.0, r_new: 0.5, rd_new: 0.05}
  tolerance_note: d2 printed from 3-decimal E and q = 0.0057565 (0.028 percent off full precision); r' is printed as an integer; RD' to one decimal.
