# Printed values from Albert, Baumer and Marchi, "Analyzing Baseball Data with R" (3rd ed.), chapter 9.2 (Markov chains),
# https://beanumber.github.io/abdwr3e/09-simulation.html, read 2026-10-20. The chain is built from 2016 Retrosheet batting
# plays in complete half-innings (three outs); bases are written in this library's notation ('1--' = runner on first).
# Transition probabilities, fundamental-matrix sums and the three-batter distribution are exact computations.
# The run expectancy matrix is printed from 10,000 simulated half-innings per state, so it carries sampling noise
# (about 0.01 to 0.02 in the mean), unlike the exact value this library solves for.
