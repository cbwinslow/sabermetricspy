# DRAFT golden fixture: Ranked Probability Score. Printed values are Epstein's positively oriented S_j (1 = perfect, 0 = worst);
# the proposed library score is the negatively oriented, 1/(K-1)-normalised loss  rps = 1 - S_j  (identity checked exactly in the dossier and in check_fixture.py).
# Entry style of sabermetricspy tests/golden/*.yaml (entries: id, source_url, retrieved, inputs, published, tolerance) plus `locator` and `basis`.
#
# Sources (primary, both scanned images; formulas and tables read by hand from page images; retrieved 2026-10-22):
#   Epstein, E. S. (1969), "A scoring system for probability forecasts of ranked categories", J. Applied Meteorology 8:985-987,
#     DOI 10.1175/1520-0450(1969)008<0985:ASSFPF>2.0.CO;2 ; sources/epstein_1969_rps/epstein1969.pdf (sha256 012e1dd57b3c...), page image epstein1969_pages/p3.png = journal p.987.
#     Table 1 (K=4, two forecasts) and Table 2 (K=6, nine forecasts), scores to 2 decimals.
#   Murphy, A. H. (1971), "A note on the ranked probability score", J. Applied Meteorology 10:155-156 ; sources/murphy_1971_rps_note/murphy1971.pdf (positive normalised form; cumulative form).
# SECOND READ (this spec pass, 2026-10-22): the Table 2 page image p.987 was re-read and agrees with the transcription below on every printed cell, including the
