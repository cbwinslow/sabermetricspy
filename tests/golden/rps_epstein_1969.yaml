# Licence / attribution: AMS journal, no licence found in the files; only numbers (facts) and the definition are reused. Cite Epstein (1969) and Murphy (1971).
# Tolerance: 0.005 + 1e-9 (printed to 2 decimals, half unit of the last place). Observed max error on the 60 matching cells: <= 0.0050 (see check output).
# Hand-arithmetic rows (unprinted) use exact fractions and a 1e-12 tolerance.
