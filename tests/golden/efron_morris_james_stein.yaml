excluded:
- id: em1975_printed_xbar_minus_3_275
  reason: JASA p.312 prints "The value of X-bar is -3.275" and eq. (2.5) intercept -2.59 (= .791 x -3.275). Both contradict the paper's own Table 1 (column mean -3.317) and Table 2
    (reproduced on 18/18 rows only with -3.317; with -3.275 every estimate moves up about .002). Cause of the slip not stated; recorded, not tested.
- id: em1975_limited_translation_s08_s09
  reason: Table 2 columns for s = 0.9 and 0.8 depend on tabled constants D_{k-1}(s) from the paper's ref [6], which was not obtained; the s = 0.8 column is only reproduced by clipping at the printed bound 0.68. Out of scope for the first implementation.
