# DRAFT golden fixture: Efron and Morris (1975) James-Stein estimator on the 1970 batting averages (arcsine transform).
# Same entry style as sabermetricspy tests/golden/*.yaml (entries: id, source_url, retrieved, inputs, published, tolerance); `locator` and `basis` added.
#
# Source (primary): B. Efron and C. Morris, "Data analysis using Stein's estimator and its generalizations", J. Amer. Statist. Assoc. 70(350):311-319 (1975),
#   DOI 10.1080/01621459.1975.10479864. Copy read: UC Merced course PDF, https://faculty.ucmerced.edu/jvevea/classes/290_21/readings/week%204/Efron%20and%20Morris.pdf
#   local: sources/efron_morris_1975_jasa/efron_morris_1975_ucmerced.pdf (sha256 542361e5c05a...). PDF p.3 = JASA p.312 (eqs 2.1-2.5); PDF p.4 = JASA p.313 (Tables 1-2).
#   Values were read from RENDERED PAGE IMAGES (the OCR text layer scrambles the tables). Retrieved 2026-10-22.
# Licence / attribution: Taylor & Francis, all rights reserved; the numbers (facts) are reused, the article text is not. Cite the paper in the docstring.
#
# Method: X = sqrt(45) * arcsin(2 y - 1), y = hits/45;  c = 1 - (k-3)/V,  V = sum (X - Xbar)^2;  estimate = Xbar + c (X - Xbar);
#   retransform  p_hat = (sin(estimate / sqrt(45)) + 1) / 2.     k = 18 players.
# Tolerances:
#   stein_retransformed 0.0005: the paper prints 3 decimals (half unit = 0.0005); the computed values round to the printed column on 18/18 rows (max diff 0.0).
#   x_transformed 0.005 and theta_transformed 0.015: Table 1 prints 2 decimals; theta is computed by the paper from rest-of-season averages printed to 3 decimals,
#     d(theta)/dp is about 15-17, so rounding of p alone moves theta by up to 0.0084, plus 0.005 for printing -> 0.015 (observed max 0.0102).
#   shrink (k-3)/V and c: 0.0005 (3 printed decimals).  TSE: 0.02 (the printed 17.56 and 5.01 sit within 0.02 of the exact-input values 17.571 and 4.999;
#     the paper computed them from its rounded columns, which give 17.558 and 5.016).  efficiency 0.02 (printed 3.50 = 17.56/5.01; exact-input ratio 3.515).
# DO NOT assert the printed Xbar = -3.275 or the eq. (2.5) intercept -2.59: they contradict the paper's own Table 1 and Table 2 (see `excluded`).
