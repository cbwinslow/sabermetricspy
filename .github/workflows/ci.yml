name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - name: Reference checks against Retrosheet and the Chadwick Register
        if: matrix.python-version == '3.12'
        env:
          SABERMETRICSPY_RETRO2016: ${{ github.workspace }}/retro2016.rda
          SABERMETRICSPY_REGISTER: ${{ github.workspace }}/chadwick-register
        run: |
          curl -sSL https://github.com/beanumber/abdwr3edata/raw/main/data/retro2016.rda -o retro2016.rda
          git clone --depth 1 https://github.com/chadwickbureau/register chadwick-register-repo
          mkdir -p chadwick-register && cp chadwick-register-repo/data/people*.csv chadwick-register/
          uv run --with pyreadr --with pandas pytest -q tests/test_retrosheet_2016_markov_win_expectancy.py tests/test_retrosheet_2016_count_fit.py tests/test_retrosheet_2016_win_expectancy.py tests/test_retrosheet_2016_linear_weights.py tests/test_markov_transitions.py tests/test_ids_real_register.py
