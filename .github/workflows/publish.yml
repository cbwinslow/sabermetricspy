name: Publish

# Publishes to PyPI when a GitHub release is published, using PyPI trusted publishing (no token stored).
# One-time setup on pypi.org: Account > Publishing > add a pending publisher for project `sabermetricspy`,
# owner `cbwinslow`, repository `sabermetricspy`, workflow `publish.yml`, environment `pypi`.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
