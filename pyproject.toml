[project]
name = "sabermetricspy"
version = "2.1.0"
description = "Fast, strongly-typed, dataframe-agnostic baseball sabermetrics calculation engine, expectancy matrix builder, and forecasting library."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "C. B. Winslow" }]
keywords = [
  "baseball",
  "sabermetrics",
  "statcast",
  "retrosheet",
  "retrosheetpy",
  "woba",
  "fip",
  "war",
  "re24",
  "polars",
  "duckdb",
  "narwhals",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]

dependencies = [
  "narwhals>=1.10.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "numpy>=1.26.0",
  "scipy>=1.13.0",
  "polars>=1.0.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.2.0"]
pyarrow = ["pyarrow>=16.0.0"]
duckdb = ["duckdb>=1.0.0"]
retrosheet = ["retrosheetpy>=0.1.0", "chadwickpy>=0.4.0"]
all = ["sabermetricspy[pandas,pyarrow,duckdb,retrosheet]"]

[project.urls]
Homepage = "https://github.com/cbwinslow/sabermetricspy"
Source = "https://github.com/cbwinslow/sabermetricspy"
Issues = "https://github.com/cbwinslow/sabermetricspy/issues"
Changelog = "https://github.com/cbwinslow/sabermetricspy/blob/main/CHANGELOG.md"

[project.scripts]
sabermetrics = "sabermetricspy.cli:main"

[project.entry-points."sabermetricspy.plugins"]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "pytest-benchmark>=5.1.0",
  "hypothesis>=6.100.0",
  "ruff>=0.6.0",
  "pyright>=1.1.380",
  "pandas>=2.2.0",
  "pyarrow>=16.0.0",
  "duckdb>=1.0.0",
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sabermetricspy"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "docs",
  "/README.md",
  "LICENSE",
  "CHANGELOG.md",
  "AGENTS.md",
  "CLAUDE.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["full_constants: needs the maintainer's full local constants table (skipped on a clean clone)"]

[tool.coverage.run]
source = ["sabermetricspy"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
